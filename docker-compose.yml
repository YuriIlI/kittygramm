# docker-compose.yml
version: '3.8'

services:
  web:
    build: .
    container_name: kittygram_adoption
    ports:
      - "8000:8000"
    volumes:
      - .:/app
      - ./db.sqlite3:/app/db.sqlite3
    env_file:
      - .env
    command: python manage.py runserver 0.0.0.0:8000
    restart: unless-stopped